limit_req_zone $binary_remote_addr zone=qdapi_upload:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=qdapi_auth:10m rate=10r/m;

server {
    listen 443 ssl;
    server_name qdapi.example.com;
    ssl_certificate /etc/letsencrypt/live/qdapi.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qdapi.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 600k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location ~ ^/MP_verify_[A-Za-z0-9]+\.txt$ {
        root /var/www/qdapi-verification;
        default_type text/plain;
    }
    location ^~ /api/upload/ {
        limit_req zone=qdapi_upload burst=10 nodelay;
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1500s;
    }
    location ^~ /api/auth/ {
        limit_req zone=qdapi_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 1500s;
        proxy_send_timeout 1500s;
    }
}
server {
    listen 80;
    server_name qdapi.example.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/qdapi-acme; }
    location / { return 301 https://$host$request_uri; }
}
